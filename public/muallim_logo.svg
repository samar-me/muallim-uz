<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="5.5" y="5.5" width="109" height="109" rx="26.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Open Book -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 60 84 C 50 78, 32 78, 22 81 L 22 46 C 32 43, 50 43, 60 49 Z" fill="#ffffff"/>
    <!-- Right Page -->
    <path d="M 60 84 C 70 78, 88 78, 98 81 L 98 46 C 88 43, 70 43, 60 49 Z" fill="#f1f5f9"/>
    <!-- Spine Line -->
    <path d="M 60 49 L 60 84" stroke="#065f46" stroke-width="2" stroke-linecap="round"/>
    <!-- Page borders -->
    <path d="M 22 46 C 32 43, 50 43, 60 49 C 70 43, 88 43, 98 46 L 98 81 C 88 78, 70 78, 60 84 C 50 78, 32 78, 22 81 Z" fill="none" stroke="#065f46" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- AI Brain / Circuit Lines inside/above Book -->
  <g stroke="#047857" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Left lobe circuits -->
    <path d="M 44 48 C 38 48, 35 53, 37 59 C 34 62, 35 68, 39 70 C 37 74, 42 77, 47 75"/>
    <!-- Right lobe circuits -->
    <path d="M 76 48 C 82 48, 85 53, 83 59 C 86 62, 85 68, 81 70 C 83 74, 78 77, 73 75"/>
    <!-- Circuit internal traces -->
    <path d="M 43 56 L 49 56 L 53 52"/>
    <path d="M 77 56 L 71 56 L 67 52"/>
    <path d="M 47 66 L 53 66"/>
    <path d="M 73 66 L 67 66"/>
  </g>
  <!-- Node dots -->
  <g fill="#047857">
    <circle cx="53" cy="52" r="2.2"/>
    <circle cx="67" cy="52" r="2.2"/>
    <circle cx="49" cy="56" r="1.8"/>
    <circle cx="71" cy="56" r="1.8"/>
    <circle cx="53" cy="66" r="1.8"/>
    <circle cx="67" cy="66" r="1.8"/>
  </g>

  <!-- Big Glowing Verification Checkmark -->
  <g filter="url(#shadow)">
    <path d="M 46 62 L 56 74 L 84 38" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 46 62 L 56 74 L 84 38" fill="none" stroke="url(#checkGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
